name: willow-image

on:
  workflow_dispatch:
  push:
    branches: [willow-port, willow-ci]

concurrency:
  group: willow-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WS: ${{ github.workspace }}/../ws

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Disk before
        run: df -h /
      - name: Stage pinned inputs
        run: |
          scripts/ci-willow-inputs.sh "$WS"
          bash scripts/stage-willow.sh "$WS"
          df -h /
      - name: Diagnostic image reproduces
        run: |
          WORK="$WS" image/diag-willow/build.sh
          git diff --exit-code image/diag-willow/SHA256SUMS
          df -h /
      - name: Build packages
        shell: bash
        run: |
          mkdir -p packages && chmod 777 packages
          ./scripts/provision.sh build 2>&1 | tee "$RUNNER_TEMP/build.log"
          df -h /
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: willow-diag-image
          path: images/diag-willow/boot-diag-willow.img
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: willow-build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7
